<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<script>(function(){try{if(localStorage.getItem("seongjwa.theme")==="light") document.documentElement.setAttribute("data-theme","light");}catch(e){}})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0d1b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="인물사전">
<title>인물사전</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌌</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Song+Myung&family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&family=JetBrains+Mono:wght@400;500&display=swap">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<style>
  :root{
    --bg-deep:#0a0d1b;
    --bg-panel:#12162c;
    --bg-elevated:#1a1f3d;
    --line-faint:#262c4d;
    --line-mid:#3a4070;
    --text-primary:#eceef6;
    --text-secondary:#9ba1c4;
    --text-muted:#666c92;
    --gold:#e8b84b;
    --rose:#e8849b;
    --star-glow:#f2d98a;
    --focus-ring:#f2d98a;
    --star-dust:#4b5178;
  }

  :root[data-theme="light"]{
    --bg-deep:#eef1fa;
    --bg-panel:#ffffff;
    --bg-elevated:#f4f6fc;
    --line-faint:#e1e5f3;
    --line-mid:#c7cce4;
    --text-primary:#1b1f36;
    --text-secondary:#4d5372;
    --text-muted:#767ca0;
    --gold:#b9822a;
    --rose:#c94a68;
    --star-glow:#b9822a;
    --focus-ring:#b9822a;
    --star-dust:#c7cce4;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:var(--bg-deep);
    color:var(--text-primary);
    font-family:"Gowun Dodum","Malgun Gothic",sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
  }
  ::selection{background:var(--gold);color:#1a1206;}
  a{color:inherit;}
  button,input,select,textarea{font-family:inherit;}

  /* ---------- top bar ---------- */
  .topbar{
    position:sticky; top:0; z-index:20;
    display:flex; align-items:center; justify-content:space-between;
    gap:14px; flex-wrap:wrap;
    padding:12px 22px;
    background:rgba(18,22,44,0.9);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line-faint);
  }
  .brand{display:flex; align-items:baseline; gap:10px;}
  .brand h1{font-family:"Song Myung",serif; font-size:1.4rem; font-weight:400; margin:0; letter-spacing:.02em;}
  .brand span{font-size:.72rem; color:var(--text-muted); font-family:"JetBrains Mono",monospace; letter-spacing:.03em;}

  .topbar-mid{display:flex; align-items:center; gap:10px; flex:1 1 260px; min-width:180px; max-width:340px;}
  .search-input{
    width:100%; padding:7px 12px; border-radius:999px;
    border:1px solid var(--line-mid); background:var(--bg-panel); color:var(--text-primary);
    font-size:.83rem; outline:none;
  }
  .search-input::placeholder{color:var(--text-muted);}
  .search-input:focus-visible{outline:2px solid var(--focus-ring); outline-offset:1px;}

  .topbar-right{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
  .legend{display:flex; gap:8px; flex-wrap:wrap;}
  .chip{
    display:flex; align-items:center; gap:6px; padding:6px 12px; border-radius:999px;
    border:1px solid var(--line-mid); background:var(--bg-panel); color:var(--text-secondary);
    font-size:.8rem; cursor:pointer; transition:border-color .15s, color .15s;
  }
  .chip:hover{border-color:var(--line-mid); color:var(--text-primary);}
  .chip:focus-visible{outline:2px solid var(--focus-ring); outline-offset:2px;}
  .chip.off{opacity:.4;}
  .chip .dot{width:9px; height:9px; border-radius:50%; flex:none;}

  .btn{
    font-size:.83rem; border:1px solid var(--line-mid); background:var(--bg-panel); color:var(--text-primary);
    padding:7px 13px; border-radius:10px; cursor:pointer; display:inline-flex; align-items:center; gap:6px;
    transition:border-color .15s, filter .15s;
  }
  .btn:hover{border-color:var(--gold);}
  .btn:focus-visible{outline:2px solid var(--focus-ring); outline-offset:2px;}
  .btn.primary{background:var(--gold); border-color:var(--gold); color:#1a1206; font-weight:700;}
  .btn.primary:hover{filter:brightness(1.06);}
  .btn.ghost{background:transparent;}

  .auth{display:flex; align-items:center; gap:8px;}
  .auth[hidden]{display:none;}
  .auth-user{display:inline-flex; align-items:center; gap:6px; font-size:.78rem; color:var(--text-secondary); font-weight:600; max-width:120px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .auth-dot{width:7px; height:7px; border-radius:50%; background:var(--teal,#5fd1c9); flex:none;}

  /* ---------- stage ---------- */
  .stage-wrap{position:relative; flex:1 1 auto; display:flex; width:100%; min-height:0;}
  #laneCol{
    position:relative; flex:none; width:96px;
    background:var(--bg-deep); border-right:1px solid var(--line-faint);
    z-index:5;
  }
  .lane-label{
    position:absolute; left:14px; display:flex; align-items:center; gap:7px;
    font-family:"Gowun Batang",serif; font-size:.82rem; color:var(--text-secondary); white-space:nowrap;
  }
  .lane-label .dot{width:8px; height:8px; border-radius:50%; flex:none;}

  #stageScroll{flex:1 1 auto; overflow-x:auto; overflow-y:hidden; position:relative;}
  #stage{display:block; width:100%;}

  .node{cursor:pointer;}
  .node circle.core{transition:r .15s ease, opacity .2s ease;}
  .node text{font-family:Consolas,"JetBrains Mono",monospace; font-size:12px; fill:var(--text-primary); pointer-events:none; transition:opacity .2s ease;}
  .node text.years{font-family:Consolas,"JetBrains Mono",monospace; font-size:9px; fill:var(--text-muted);}
  .node:focus-visible circle.ring{stroke:var(--focus-ring); stroke-width:2;}

  .selected-fade .node:not(.active-node) circle.core,
  .selected-fade .node:not(.active-node) text{opacity:.18;}
  .selected-fade .edge:not(.active-edge){opacity:.05;}

  .edge{fill:none; stroke:var(--line-mid); transition:opacity .2s ease, stroke .2s ease;}
  .edge.active-edge{stroke:var(--star-glow);}

  .grid-line{stroke:var(--line-faint); stroke-dasharray:2 5;}
  .lane-divider{stroke:var(--line-faint); opacity:.7;}
  .grid-label{font-family:"JetBrains Mono",monospace; font-size:11px; fill:var(--text-muted);}
  .bg-star{fill:var(--star-dust);}

  #emptyHint{
    position:absolute; inset:0; display:none; flex-direction:column; align-items:center; justify-content:center;
    gap:14px; pointer-events:none; text-align:center;
  }
  #emptyHint p{color:var(--text-muted); font-size:.92rem; margin:0; max-width:280px; line-height:1.7;}
  #emptyHint button{pointer-events:auto;}

  .line-legend{
    position:absolute; left:110px; bottom:14px; display:flex; flex-direction:column; gap:5px;
    font-family:"JetBrains Mono",monospace; font-size:10.5px; color:var(--text-muted); pointer-events:none;
  }
  .line-legend .row{display:flex; align-items:center; gap:8px;}

  /* ---------- detail panel ---------- */
  .panel{
    position:fixed; top:0; right:0; height:100%; width:380px; max-width:92vw;
    background:var(--bg-panel); border-left:1px solid var(--line-faint);
    box-shadow:-20px 0 40px rgba(0,0,0,.35);
    transform:translateX(100%); transition:transform .28s cubic-bezier(.2,.8,.2,1);
    z-index:30; overflow-y:auto; padding:22px 22px 40px;
  }
  .panel.open{transform:translateX(0);}
  .panel-close{
    position:absolute; top:16px; right:16px; width:30px; height:30px; border-radius:50%;
    border:1px solid var(--line-mid); background:var(--bg-elevated); color:var(--text-secondary);
    font-size:16px; line-height:1; cursor:pointer;
  }
  .panel-close:hover{color:var(--text-primary);}
  .panel-close:focus-visible{outline:2px solid var(--focus-ring); outline-offset:2px;}
  .panel-actions{position:absolute; top:16px; right:54px; display:flex; gap:6px;}
  .mini-btn{
    font-size:.76rem; padding:6px 10px; border-radius:8px; border:1px solid var(--line-mid);
    background:var(--bg-elevated); color:var(--text-secondary); cursor:pointer;
  }
  .mini-btn:hover{color:var(--text-primary); border-color:var(--line-mid);}
  .mini-btn.danger{color:var(--rose); border-color:rgba(232,132,155,.35);}
  .mini-btn.danger:hover{background:rgba(232,132,155,.1);}
  .mini-btn.primary{background:var(--gold); border-color:var(--gold); color:#1a1206; font-weight:700;}
  .mini-btn:disabled{opacity:.4; cursor:not-allowed;}

  .spotlight-tag{display:inline-block; font-family:"JetBrains Mono",monospace; font-size:.7rem; color:var(--gold); background:var(--bg-elevated); padding:4px 10px; border-radius:999px; margin-bottom:14px;}
  .badge{display:inline-flex; align-items:center; gap:6px; font-family:"JetBrains Mono",monospace; font-size:11px; padding:4px 10px; border-radius:999px; background:var(--bg-elevated); margin-bottom:34px;}
  .badge .dot{width:8px; height:8px; border-radius:50%;}

  .panel h2{font-family:"Gowun Batang",serif; font-size:1.5rem; font-weight:700; margin:0 0 2px; text-wrap:balance;}
  .update-count{font-family:"JetBrains Mono",monospace; font-size:0.8rem; font-weight:400; color:var(--text-muted);}
  .panel .years{font-family:"JetBrains Mono",monospace; color:var(--text-muted); font-size:.8rem; margin-bottom:14px;}
  .panel .bio{color:var(--text-secondary); font-size:.9rem; line-height:1.75; margin-bottom:22px;}
  .panel h3{font-size:.76rem; color:var(--text-muted); text-transform:uppercase; letter-spacing:.08em; margin:0 0 10px; font-weight:400;}

  .rel-list{list-style:none; margin:0 0 10px; padding:0; display:flex; flex-direction:column; gap:8px;}
  .rel-item{display:flex; align-items:center; gap:9px; padding:9px 11px; background:var(--bg-elevated); border-radius:10px; font-size:.85rem; cursor:pointer; border:1px solid transparent;}
  .rel-item:hover{border-color:var(--line-mid);}
  .rel-item .dot{width:8px; height:8px; border-radius:50%; flex:none;}
  .rel-name{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .rel-type{font-family:"JetBrains Mono",monospace; font-size:10px; color:var(--text-muted); white-space:nowrap;}
  .rel-del{background:none; border:none; color:var(--text-muted); cursor:pointer; font-size:12px; padding:2px 4px;}
  .rel-del:hover{color:var(--rose);}

  .rel-add{display:flex; gap:6px; margin-bottom:22px;}
  .rel-add input[type=text]{flex:1; min-width:0;}
  .rel-add select{flex:none; width:76px;}

  select, input[type=text], input[type=number], textarea{
    background:var(--bg-elevated); border:1px solid var(--line-mid); color:var(--text-primary);
    border-radius:8px; padding:8px 10px; font-size:.85rem; outline:none;
  }
  select:focus-visible, input:focus-visible, textarea:focus-visible{outline:2px solid var(--focus-ring); outline-offset:1px;}
  textarea{resize:vertical; width:100%;}

  .notes{display:flex; flex-direction:column; gap:10px; margin-bottom:6px;}
  .note-card{background:var(--bg-elevated); border-left:2px solid var(--gold); border-radius:6px; padding:10px 12px;}
  .note-date{display:flex; align-items:center; justify-content:space-between; font-family:"JetBrains Mono",monospace; font-size:10px; color:var(--text-muted); margin-bottom:4px;}
  .note-del{background:none; border:none; color:var(--text-muted); cursor:pointer; font-size:11px;}
  .note-del:hover{color:var(--rose);}
  .note-text{font-size:.87rem; color:var(--text-secondary); line-height:1.6; white-space:pre-wrap;}
  .note-empty{font-size:.84rem; color:var(--text-muted); padding:8px 0;}
  .note-add{display:flex; flex-direction:column; gap:8px; margin-top:12px;}

  /* ---------- modal ---------- */
  .modal{
    position:fixed; inset:0; background:rgba(5,7,15,.62); display:flex; align-items:center; justify-content:center;
    z-index:50; opacity:0; pointer-events:none; transition:opacity .15s ease; padding:20px;
  }
  .modal.open{opacity:1; pointer-events:auto;}
  .modal-card{
    position:relative;
    background:var(--bg-panel); border:1px solid var(--line-faint); border-radius:14px;
    padding:26px; width:840px; max-width:100%; max-height:88vh; overflow-y:auto;
  }
  .modal-card h2{font-family:"Gowun Batang",serif; font-size:1.2rem; font-weight:700; margin:0 0 18px;}
  .cat-card{width:440px;}
  .cat-row{display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--line-faint);}
  .cat-row:last-child{border-bottom:none;}
  .cat-row .dot{width:12px; height:12px; border-radius:50%; flex:none;}
  .cat-name-input{flex:1; min-width:0;}
  .cat-count{font-family:"JetBrains Mono",monospace; font-size:.72rem; color:var(--text-muted); white-space:nowrap;}
  .cat-empty{color:var(--text-muted); font-size:.85rem; padding:6px 0;}
  .field{display:flex; flex-direction:column; gap:6px; margin-bottom:14px;}
  .field label{font-size:.78rem; color:var(--text-muted);}
  .field-row{display:flex; gap:10px;}
  .field-row .field{flex:1;}
  .modal-actions{display:flex; justify-content:flex-end; gap:8px; margin-top:20px;}

  .footer-note{
    padding:14px 22px 20px; color:var(--text-muted); font-size:.78rem; text-align:center;
  }

  @media (max-width:760px){
    .topbar-mid{order:3; max-width:none; flex:1 1 100%;}
    .panel{width:100%; max-width:100%; top:auto; bottom:0; height:82vh; border-left:none; border-top:1px solid var(--line-faint); border-radius:16px 16px 0 0; transform:translateY(100%);}
    .panel.open{transform:translateY(0);}
    #laneCol{width:68px;}
    .lane-label{font-size:.7rem; left:8px;}
    .line-legend{display:none;}
  }

  @media (prefers-reduced-motion:reduce){
    .chip,.edge,.node circle.core,.node text,.panel,.modal{transition:none;}
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <h1>인물사전</h1>
    <span>PERSONAL CONSTELLATION</span>
  </div>
  <div class="topbar-mid">
    <input type="text" id="searchInput" class="search-input" placeholder="인물 검색 후 Enter">
  </div>
  <div class="topbar-right">
    <nav class="legend" id="legend" aria-label="분야 필터"></nav>
    <button class="btn ghost" id="manageCatBtn">⚙ 분야</button>
    <button class="btn primary" id="addPersonBtn">+ 인물</button>
    <button class="btn ghost" id="themeToggle" aria-label="화면 모드 전환">🌙</button>
    <span class="auth" id="authArea" hidden></span>
  </div>
</header>

<div class="stage-wrap">
  <div id="laneCol" aria-hidden="true"></div>
  <div id="stageScroll">
    <svg id="stage" viewBox="0 0 900 400" role="img" aria-label="내가 학습한 인물들을 시대와 관계로 연결한 성좌 지도"></svg>
    <div class="line-legend" aria-hidden="true">
      <div class="row"><svg width="30" height="10"><line x1="0" y1="5" x2="30" y2="5" stroke="#9ba1c4" stroke-width="1.6"/></svg> 사제</div>
      <div class="row"><svg width="30" height="10"><line x1="0" y1="5" x2="30" y2="5" stroke="#9ba1c4" stroke-width="1.6" stroke-dasharray="5 3"/></svg> 영향</div>
      <div class="row"><svg width="30" height="10"><line x1="0" y1="5" x2="30" y2="5" stroke="#9ba1c4" stroke-width="1.6" stroke-dasharray="1 3.2" stroke-linecap="round"/></svg> 교류</div>
    </div>
  </div>
  <div id="emptyHint">
    <p>아직 추가된 인물이 없어요.<br>관심 있는 인물부터 하나씩 채워보세요.</p>
    <button class="btn primary" id="emptyAddBtn">+ 첫 인물 추가하기</button>
  </div>
</div>

<p class="footer-note">역사 · 철학 · 음악 등 내가 학습한 인물을 시대와 관계로 기록하는 개인 성좌 지도</p>

<div class="panel" id="panel" aria-hidden="true">
  <div id="panelBody"></div>
</div>

<div class="modal" id="personModal" aria-hidden="true">
  <div class="modal-card">
    <button type="button" class="panel-close" id="pmClose" aria-label="닫기">✕</button>
    <h2 id="pmTitle">새 인물 추가</h2>
    <form id="pmForm">
      <div class="field">
        <label for="pmName">이름</label>
        <input type="text" id="pmName" required>
      </div>
      <div class="field-row">
        <div class="field">
          <label for="pmYear">출생년월일 (예: 1960.3.5, 연도만: 1960, 기원전: -470)</label>
          <input type="text" id="pmYear" placeholder="1960.3.5" required>
        </div>
        <div class="field">
          <label for="pmDeathYear">사망년월일 (예: 2010.1.14, 생존 시 비워두세요)</label>
          <input type="text" id="pmDeathYear" placeholder="2010.1.14">
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label for="pmCat">분야</label>
          <select id="pmCat"></select>
          <input type="text" id="pmNewCat" placeholder="새 분야 이름" style="display:none; margin-top:6px;">
        </div>
        <div class="field">
          <label for="pmSub">서브 카테고리 (선택)</label>
          <select id="pmSub"></select>
          <input type="text" id="pmNewSub" placeholder="새 서브 카테고리 이름" style="display:none; margin-top:6px;">
        </div>
      </div>
      <div class="field">
        <label for="pmBio">한줄 소개</label>
        <textarea id="pmBio" rows="3" style="resize:none; overflow-y:auto; max-height:320px;"></textarea>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn ghost" id="pmCancel">취소</button>
        <button type="submit" class="btn primary">저장</button>
      </div>
    </form>
  </div>
</div>

<div class="modal" id="catModal" aria-hidden="true">
  <div class="modal-card cat-card">
    <button type="button" class="panel-close" id="catClose" aria-label="닫기">✕</button>
    <h2>분야 관리</h2>
    <div id="catList"></div>
    <div class="modal-actions">
      <button type="button" class="btn ghost" id="catCancel">닫기</button>
      <button type="button" class="btn primary" id="catSaveBtn">저장</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
<script>
(function(){
  if(!window.firebase || !window.FIREBASE_CONFIG || !window.FIREBASE_CONFIG.apiKey || !window.SEONGJWA) return;
  try{ firebase.initializeApp(window.FIREBASE_CONFIG); }catch(e){ return; }
  var auth=firebase.auth(), db=firebase.firestore();
  try{ db.enablePersistence({synchronizeTabs:true}).catch(function(){}); }catch(e){}
  auth.getRedirectResult().catch(function(){});

  var area=document.getElementById("authArea");
  area.hidden=false;
  var docRef=null, unsub=null, applying=false, lastJson=null, timer=null;

  function short(u){ return u.displayName ? u.displayName.split(" ")[0] : (u.email||"사용자"); }
  function renderAuth(user){
    if(user){
      area.innerHTML='<span class="auth-user"><span class="auth-dot"></span>'+short(user)+'</span><button class="btn ghost" id="sOut">로그아웃</button>';
      document.getElementById("sOut").onclick=function(){ if(unsub){unsub();unsub=null;} auth.signOut(); };
    }else{
      area.innerHTML='<button class="btn primary" id="sIn">Google 로그인 · 동기화</button>';
      document.getElementById("sIn").onclick=function(){
        var p=new firebase.auth.GoogleAuthProvider();
        auth.signInWithPopup(p).catch(function(e){
          var c=e&&e.code;
          if(c==="auth/popup-closed-by-user"||c==="auth/cancelled-popup-request") return;
          if(c==="auth/popup-blocked"||c==="auth/operation-not-supported-in-this-environment"){ auth.signInWithRedirect(p); return; }
          alert("로그인 실패: "+(e&&e.message||e));
        });
      };
    }
  }

  function pushNow(){
    if(!docRef) return;
    var json=JSON.stringify(SEONGJWA.get());
    lastJson=json;
    docRef.set({json:json, updatedAt:firebase.firestore.FieldValue.serverTimestamp()}).catch(function(){});
  }
  function schedulePush(){ if(timer) clearTimeout(timer); timer=setTimeout(pushNow,700); }

  auth.onAuthStateChanged(function(user){
    renderAuth(user);
    if(unsub){ unsub(); unsub=null; }
    if(!user){ docRef=null; lastJson=null; SEONGJWA.onSave=null; return; }
    docRef=db.collection("users").doc(user.uid).collection("seongjwa").doc("state");
    docRef.get().then(function(snap){
      var d=snap.exists?snap.data():null;
      if(d && d.json){
        lastJson=d.json;
        applying=true; try{ SEONGJWA.replace(JSON.parse(d.json)); }catch(e){} applying=false;
      }else{
        pushNow();
      }
      unsub=docRef.onSnapshot(function(doc){
        if(!doc.exists || doc.metadata.hasPendingWrites) return;
        var dd=doc.data(); if(!dd||!dd.json||dd.json===lastJson) return;
        lastJson=dd.json;
        applying=true; try{ SEONGJWA.replace(JSON.parse(dd.json)); }catch(e){} applying=false;
      });
    }).catch(function(e){ console.warn("sync load fail", e); });
    SEONGJWA.onSave=function(){ if(applying) return; schedulePush(); };
  });
})();
</script>
</body>
